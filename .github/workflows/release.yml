name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io

jobs:
  # Prepare release
  prepare:
    name: Prepare Release
    runs-on: arc-runner-set
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - including all changes"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Changes since $PREV_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          # Save changelog for later use
          echo "$CHANGELOG" > CHANGELOG.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  # Build release binaries
  build-binaries:
    name: Build Release Binaries
    runs-on: arc-runner-set
    needs: prepare
    strategy:
      matrix:
        service:
          [core, marketplace, delivery, booking, mytorracab, media, realtime]
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          SERVICE="${{ matrix.service }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          if [ -d "services/${SERVICE}" ]; then
            cd services/${SERVICE}

            # Determine binary extension
            EXT=""
            if [ "$OS" = "windows" ]; then
              EXT=".exe"
            fi

            # Build API binary
            if [ -d "cmd/api" ]; then
              OUTPUT="../../dist/${SERVICE}-api-${VERSION}-${OS}-${ARCH}${EXT}"
              CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build \
                -ldflags="-w -s -X main.Version=${VERSION} -X main.BuildTime=$(date -u +%Y%m%d-%H%M%S)" \
                -o "$OUTPUT" \
                ./cmd/api

              # Create checksum
              sha256sum "$OUTPUT" > "${OUTPUT}.sha256"
            fi

            # Build Worker binary
            if [ -d "cmd/worker" ]; then
              OUTPUT="../../dist/${SERVICE}-worker-${VERSION}-${OS}-${ARCH}${EXT}"
              CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build \
                -ldflags="-w -s -X main.Version=${VERSION} -X main.BuildTime=$(date -u +%Y%m%d-%H%M%S)" \
                -o "$OUTPUT" \
                ./cmd/worker

              # Create checksum
              sha256sum "$OUTPUT" > "${OUTPUT}.sha256"
            fi
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.service }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 30

  # Build and push Docker images
  docker-release:
    name: Build and Push Docker Images
    runs-on: arc-runner-set
    needs: prepare
    strategy:
      matrix:
        service:
          [core, marketplace, delivery, booking, mytorracab, media, realtime]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mytorra-${{ matrix.service }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/mytorra-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.title=mytorra-${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

