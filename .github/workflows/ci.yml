name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  security-events: write

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  # Build job - compiles all services
  build:
    name: Build Services
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        service:
          [core, marketplace, delivery, booking, torracab, media, realtime]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: |
          go mod download
          go work sync

      - name: Build ${{ matrix.service }} service
        run: |
          if [ -d "services/${{ matrix.service }}" ]; then
            echo "Building ${{ matrix.service }} service..."
            cd services/${{ matrix.service }}

            # Build API if exists
            if [ -d "cmd/api" ]; then
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
                -ldflags="-w -s -X main.Version=${{ github.sha }}" \
                -o ../../bin/${{ matrix.service }}-api \
                ./cmd/api
            fi

            # Build Worker if exists
            if [ -d "cmd/worker" ]; then
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
                -ldflags="-w -s -X main.Version=${{ github.sha }}" \
                -o ../../bin/${{ matrix.service }}-worker \
                ./cmd/worker
            fi
          else
            echo "Service ${{ matrix.service }} not yet implemented"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-binaries
          path: bin/
          retention-days: 7

  # Test job - runs all tests
  test:
    name: Run Tests
    runs-on: [self-hosted, linux, x64]
    needs: build
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "MYTORRA_DATABASE_HOST=localhost" >> .env.test
          echo "MYTORRA_DATABASE_USER=test" >> .env.test
          echo "MYTORRA_DATABASE_PASSWORD=test" >> .env.test
          echo "MYTORRA_DATABASE_NAME=testdb" >> .env.test
          echo "MYTORRA_REDIS_HOST=localhost" >> .env.test

      - name: Run unit tests
        run: |
          CGO_ENABLED=1 go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        env:
          MYTORRA_ENVIRONMENT: test

      # TODO: Enable when integration tests are implemented
      # - name: Run integration tests
      #   run: |
      #     CGO_ENABLED=1 go test -v -race -tags=integration ./tests/integration/...
      #   env:
      #     MYTORRA_ENVIRONMENT: test

      # TODO: Enable when CODECOV_TOKEN is configured
      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     file: ./coverage.txt
      #     flags: unittests
      #     name: codecov-umbrella

      - name: Generate test report
        if: always()
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          CGO_ENABLED=1 go test -v ./... 2>&1 | go-junit-report -set-exit-code > test-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-report.xml

  # Lint job - code quality checks
  lint:
    name: Lint Code
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m --config=.golangci.yml
          skip-cache: true
          working-directory: .

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Please run 'make fmt'"
            gofmt -d .
            exit 1
          fi

      - name: Check Go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go.mod or go.sum is not tidy. Please run 'go mod tidy'"
            git diff
            exit 1
          fi

  # Security scan job
  security:
    name: Security Scan
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif

      - name: Run Nancy vulnerability scanner
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -deps ./... | nancy sleuth

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

